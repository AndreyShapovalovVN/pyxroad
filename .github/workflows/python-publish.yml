name: Publish Python package

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Install dependency wheels only; test the checked-out source without building it.
      - name: Install dependencies
        run: uv sync --locked --extra dev --no-build --no-install-project
      - name: Run tests
        run: uv run --no-sync python -m pytest

  pypi-publish:
    needs: test
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi  # Має збігатися з назвою у налаштуваннях PyPI
    permissions:
      id-token: write  # Обов'язково для Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # The project is built explicitly below, not during dependency installation.
      - name: Install locked build dependencies
        run: uv sync --locked --no-build --no-install-project
      - name: Check license inventory
        run: uv run --no-sync python scripts/check_licenses.py
      - name: Build package
        run: uv build --no-build-isolation
      - name: Check packaged license notices
        run: uv run --no-sync python scripts/check_licenses.py --dist-dir dist
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
