name: CI Security & Quality

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:


jobs:
  code-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Install dependency wheels only; test the checked-out source without building it.
      - name: Install dependencies
        run: uv sync --locked --extra dev --no-build --no-install-project

      - name: Check license inventory
        run: uv run --no-sync python scripts/check_licenses.py

      - name: Lint with Ruff
        run: uv run --no-sync ruff check . --extend-exclude 'tests/~*.py'

      - name: Type check with mypy
        run: uv run --no-sync mypy . --ignore-missing-imports --pretty --show-error-codes

      - name: Run tests with pytest
        run: uv run --no-sync python -m pytest --maxfail=2 --disable-warnings --ignore-glob='tests/~*.py'

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1
